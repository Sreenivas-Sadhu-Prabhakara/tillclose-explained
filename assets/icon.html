<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2B152F; }
  body { display: grid; place-items: center; }
  /* 12% safe padding -> mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- a drawer well with a coin dropping in — the "explained" motion cue -->
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <!-- dropping coin above the well -->
    <ellipse cx="50" cy="18" rx="13" ry="5" fill="#E7C583" opacity="0.55"/>
    <!-- the well -->
    <rect x="16" y="34" width="68" height="46" rx="8" fill="#3D2140" stroke="#D8AC5E" stroke-width="3.4"/>
    <line x1="50" y1="34" x2="50" y2="80" stroke="#D8AC5E" stroke-width="2.4" opacity="0.85"/>
    <!-- coin stack settling, right compartment -->
    <ellipse cx="67" cy="52" rx="11" ry="4.4" fill="#D8AC5E"/>
    <ellipse cx="67" cy="58" rx="11" ry="4.4" fill="#D8AC5E"/>
    <ellipse cx="67" cy="64" rx="11" ry="4.4" fill="#D8AC5E"/>
    <ellipse cx="67" cy="70" rx="11" ry="4.4" fill="#E7C583"/>
    <!-- note bundle, left compartment -->
    <rect x="24" y="50" width="20" height="22" rx="2.5" fill="#D8AC5E" opacity="0.55"/>
    <rect x="27" y="54" width="20" height="22" rx="2.5" fill="#D8AC5E"/>
  </svg>
</body>
</html>
